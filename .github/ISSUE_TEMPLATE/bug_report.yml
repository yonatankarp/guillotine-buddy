name: Bug report
description: A character looks, talks or behaves wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw. A screenshot helps a lot.
    validations:
      required: true
  - type: input
    id: character
    attributes:
      label: Which character
      description: '`/piposh` says who is here'
  - type: input
    id: version
    attributes:
      label: Claude Code version
      description: Output of `claude --version`
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where
      options: [Terminal, Claude desktop app, VS Code, Other]
    validations:
      required: true
  - type: input
    id: terminal
    attributes:
      label: Terminal app and size
      description: For example "iTerm2, 160x45" or "Ghostty, fullscreen"
